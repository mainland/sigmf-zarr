name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Sync locked environment
        run: uv sync --locked --extra dev --extra docs --extra query
      - name: Run tests
        run: .venv/bin/pytest --no-cov

  viewer:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Sync viewer environment
        run: uv sync --locked --extra dev --extra query --extra viewer
      - name: Run tests including desktop integration
        run: .venv/bin/pytest --no-cov

  pytorch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Sync integration development environment
        run: uv sync --locked --extra dev --extra query --extra viewer
      - name: Install CPU PyTorch
        run: uv pip install --python .venv/bin/python 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests and coverage with both optional integrations
        run: .venv/bin/pytest
      - name: Type check
        run: .venv/bin/mypy src examples

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync locked environment
        run: uv sync --locked --extra dev --extra docs
      - name: Lint
        run: uv run ruff check src tests docs benchmarks examples
      - name: Check docstring formatting
        run: uv run docformatter --check --recursive src tests benchmarks examples
      - name: Build documentation
        run: uv run sphinx-build -b html -W docs docs/_build/html

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Create minimum supported environment
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python --resolution lowest-direct '.[dev,query,viewer]'
      - name: Install minimum CPU PyTorch
        run: uv pip install --python .venv/bin/python 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Test minimum supported dependencies
        run: .venv/bin/pytest --no-cov

  latest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tox
        run: python -m pip install tox
      - name: Test latest compatible dependencies
        run: tox

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Build distributions
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Install and smoke-test wheel
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python dist/*.whl
          .venv/bin/sigmf-zarr import sigmf --help
          .venv/bin/python -c 'import sys; import sigmf_zarr; assert "torch" not in sys.modules'
          .venv/bin/sigmf-zarr view --help
          .venv/bin/sigmf-zarr --version
          .venv/bin/sigmf-zarr import radioml2016 --help
          .venv/bin/sigmf-zarr import radioml2018 --help
          .venv/bin/sigmf-zarr import rml22 --help
          .venv/bin/sigmf-zarr import cspb --help
          .venv/bin/sigmf-zarr import panoradio --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
