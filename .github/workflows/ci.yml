name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: false
      - run: uv lock --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: false
      - run: >-
          uvx --with tox-uv==1.37.0 tox==4.67.1
          -e ${{ matrix.python-version }}

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: false
      - run: uvx --with tox-uv==1.37.0 tox==4.67.1 -e min

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: false
      - run: uv sync --locked
      - run: uvx --with tox-uv==1.37.0 tox==4.67.1 -e lint

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: false
      - run: uvx --with tox-uv==1.37.0 tox==4.67.1 -e docs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: false
      - name: Build distributions
        # Pin the build backend, which pyproject.toml gives only lower
        # bounds for.
        run: uv build --build-constraint .github/build-constraints.txt
      - name: Check distribution metadata
        run: uvx twine==7.0.0 check dist/*
      - name: Install and smoke-test wheel
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python dist/*.whl
          .venv/bin/sigmf-zarr import sigmf --help
          .venv/bin/sigmf-zarr --version
          .venv/bin/sigmf-zarr import radioml2016 --help
          .venv/bin/sigmf-zarr import radioml2018 --help
          .venv/bin/sigmf-zarr import rml22 --help
          .venv/bin/sigmf-zarr import cspb --help
          .venv/bin/sigmf-zarr import panoradio --help
      - name: Smoke-test store inspection and export
        run: |
          .venv/bin/python - <<'EOF'
          import numpy as np
          from sigmf_zarr import SigMFZarrStore

          with SigMFZarrStore.create("smoke.zarr") as store:
              recording = store.recordings.create(
                  "rec",
                  sample_shape=(4,),
                  global_metadata={"core:datatype": "rf32_le"},
              )
              recording.set_samples(np.arange(4, dtype=np.float32))
          EOF
          .venv/bin/sigmf-zarr store smoke.zarr integrity update
          .venv/bin/sigmf-zarr store smoke.zarr validate
          .venv/bin/sigmf-zarr store smoke.zarr recording rec info --format json
          .venv/bin/sigmf-zarr export smoke.zarr smoke.sigmf-meta \
            --recording-name rec
          .venv/bin/sigmf-zarr import sigmf smoke.sigmf-meta roundtrip.zarr
          .venv/bin/sigmf-zarr store roundtrip.zarr integrity verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: distributions
          path: dist/
