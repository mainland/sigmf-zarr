name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Sync locked environment
        run: uv sync --locked --extra dev --extra docs
      - name: Run tests
        run: uv run pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync locked environment
        run: uv sync --locked --extra dev --extra docs
      - name: Lint
        run: uv run ruff check src tests docs
      - name: Check docstring formatting
        run: uv run docformatter --check --recursive src tests
      - name: Type check
        run: uv run mypy src
      - name: Build documentation
        run: uv run sphinx-build -b html -W docs docs/_build/html

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Create minimum supported environment
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python --resolution lowest-direct '.[dev]'
      - name: Test minimum supported dependencies
        run: .venv/bin/pytest

  latest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tox
        run: python -m pip install tox
      - name: Test latest compatible dependencies
        run: tox

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Build distributions
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Install and smoke-test wheel
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python dist/*.whl
          .venv/bin/sigmf-zarr import sigmf --help
          .venv/bin/sigmf-zarr --version
          .venv/bin/sigmf-zarr import radioml2016 --help
          .venv/bin/sigmf-zarr import radioml2018 --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
