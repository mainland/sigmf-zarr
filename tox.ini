[tox]
envlist = py312,type,lint,doc
isolated_build = true

[testenv]
extras = dev
commands = pytest

[testenv:pytorch]
extras =
  dev
  pytorch
commands = pytest

[testenv:type]
extras =
  dev
  pytorch
commands = mypy src

[testenv:lint]
extras = dev
commands =
  ruff check src tests docs benchmarks
  docformatter --check --recursive src tests benchmarks

[testenv:doc]
extras =
  dev
  docs
commands = sphinx-build -b html -W docs docs/_build/html
