repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^uv\.lock$
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        exclude: ^uv\.lock$

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 03a7d1a4936b5889602852175bca2d39acb3281e  # frozen: v0.3.0
    hooks:
      - id: rumdl

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/python -m ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv/bin/python -m mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: sp-repo-review
        name: sp-repo-review
        entry: .venv/bin/sp-repo-review .
        language: system
        files: ^(pyproject\.toml|\.pre-commit-config\.yaml|\.readthedocs\.yaml|\.github/.*)$
        pass_filenames: false
